name: Release and deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require stable SemVer tag on latest main
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            echo "Expected a stable SemVer tag such as v1.2.3."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$TAG_SHA^{commit}")"
          main_commit="$(git rev-parse origin/main^{commit})"

          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Release tag must point to the latest main commit."
            echo "tag:  $tag_commit"
            echo "main: $main_commit"
            exit 1
          fi

  build_release:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build production site
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_BASE_PATH: /dove-wiki/
        run: npm run build

      - name: Verify and package release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          grep -q '/dove-wiki/assets/' dist/index.html

          mkdir release
          (cd dist && zip -q -r "../release/dove-wiki-${TAG_NAME}.zip" .)
          (cd release && sha256sum "dove-wiki-${TAG_NAME}.zip" > "dove-wiki-${TAG_NAME}.zip.sha256")

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(
            "release/dove-wiki-${TAG_NAME}.zip"
            "release/dove-wiki-${TAG_NAME}.zip.sha256"
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Dove Tower Wiki ${TAG_NAME}"
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: build_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

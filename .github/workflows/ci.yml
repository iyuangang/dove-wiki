name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check:data && npm test

      - name: Build GitHub Pages artifact
        env:
          VITE_APP_VERSION: ci-${{ github.sha }}
          VITE_BASE_PATH: /dove-wiki/
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/dove-wiki/assets/' dist/index.html

      - name: Install browser for UI regression checks
        run: npx playwright install --with-deps chromium

      - name: Check browser workflows at four widths
        run: npx playwright test

      - name: Save browser regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
